{% comment %}Avatar image for the current user, or the default icon.{% endcomment %}
{% if user.is_authenticated and user.profile.image %}
    <img class="user-badge__avatar" src="{{ user.profile.image.url }}" alt=""
         width="36" height="36">
{% else %}
    <svg class="user-badge__avatar" viewBox="0 0 64 64" role="img"
         aria-label="Profile picture">
        <circle cx="32" cy="32" r="32" fill="#c8a27c"/>
        <circle cx="32" cy="25" r="12" fill="#3b2a21"/>
        <path d="M12 56c0-11 9-18 20-18s20 7 20 18z" fill="#3b2a21"/>
    </svg>
{% endif %}
