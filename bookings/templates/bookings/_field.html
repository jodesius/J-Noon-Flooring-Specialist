{% comment %}One form field: label, widget, help text, errors.{% endcomment %}
<div class="bk-field{% if field.errors %} bk-field--invalid{% endif %}{% if field.field.widget.input_type == 'checkbox' %} bk-field--check{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<span class="bk-field__help">{{ field.help_text }}</span>{% endif %}
    {% for error in field.errors %}<span class="bk-field__error">{{ error }}</span>{% endfor %}
</div>
